on:
  schedule:
  - cron: "30 17 * * 5" # Friday afternoon
  workflow_dispatch:
    inputs:
      dryRun:
        type: boolean
        default: false
  pull_request:
    paths:
    - .github/workflows/renovate-here.yml
    - composite-actions/renovate/action.yml
    - renovate.sh

jobs:
  upgrade-dependencies:
    strategy:
      fail-fast: false
      matrix:
        repo:
          - ${{ github.repository }}
          - bmillwood/bluesky-tools
          - bmillwood/freecell
          - bmillwood/nur-packages
    runs-on: ubuntu-latest
    steps:
    - uses: $/composite-actions/renovate
      with:
        app-client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
        app-private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        dry-run: ${{ inputs.dryRun || github.event_name == 'pull_request' }}
      env:
        RENOVATE_REPOSITORIES: ${{ matrix.repo }}
