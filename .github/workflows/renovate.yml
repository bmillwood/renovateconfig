on:
  workflow_call:
    secrets:
      RENOVATE_APP_CLIENT_ID:
        required: true
      RENOVATE_APP_PRIVATE_KEY:
        required: true
    inputs:
      dryRun:
        type: boolean
        default: ${{ github.event_name == 'pull_request' }}

jobs:
  upgrade-dependencies:
    runs-on: ubuntu-latest
    env:
      RENOVATE_ONBOARDING: false
      RENOVATE_REPOSITORIES: ${{ github.repository }}
      RENOVATE_EXTENDS: config:recommended,helpers:pinGitHubActionDigests
      # Noisy, but IME a lot of what you care about is at debug level.
      LOG_LEVEL: debug

      RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
      # Use config from the branch for PRs and workflow_dispatch
      # I'd rather have "replace" than "merge", but as far as I can tell that
      # doesn't exist.
      RENOVATE_USE_BASE_BRANCH_CONFIG: merge
      RENOVATE_BASE_BRANCH_PATTERNS: ${{ github.head_ref || github.ref_name }}

      RENOVATE_CUSTOM_MANAGERS: |
        [
          {
            "customType": "regex",
            "description": "Update versions anywhere, using marker comments",
            "managerFilePatterns": [".github/workflows/*"],
            "matchStrings": [
              ":\\s*(?<currentValue>[0-9.]+)\\s*# renovate: datasource=(?<datasource>[a-z-]+) depName=(?<depName>\\S+)",
            ],
          },
          {
            "customType": "regex",
            "description": "Update git digests of branches anywhere, using marker comments",
            "managerFilePatterns": [".github/workflows/*"],
            "matchStrings": [
              ":\\s*(?<currentDigest>[a-f0-9]{40})\\s*# renovate: datasource=(?<datasource>[a-z-]+) depName=(?<depName>\\S+) packageName=(?<packageName>\\S+) currentValue=(?<currentValue>\\S+)",
            ],
            // when I'm trying to update a digest, I usually don't want to also
            // update the currentValue
            // "versioning" is the wrong parameter to configure this, it only
            // affects extracting versions, not deciding on new ones
            "versioningTemplate": "exact",
          },
        ]

      # I use this in Haskell packages to ensure CI actually uses the new
      # verison.
      RENOVATE_COMMIT_BODY: >-
        {{#each upgrades}}New-{{{datasource}}}-version: {{{depName}}}{{#if newVersion}}=={{{newVersion}}}{{else if newDigest}}=={{{newDigest}}}{{/if}}\n{{/each}}

      # This is just a crude way to find out if there were any warnings or
      # errors.
      RENOVATE_LOG_FILE: /tmp/renovate-log.jsonl
      RENOVATE_LOG_FILE_LEVEL: warn

      RENOVATE_PR_HOURLY_LIMIT: 0
    steps:
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      with:
        client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
        private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-issues: write
        permission-workflows: write
        # When run from a PR, it should be in dry-run mode, so shouldn't create PRs.
        # But if it did, it's not too hard to imagine a PR creation loop. So
        # let's add another layer of protection.
        permission-pull-requests: "${{ github.event_name == 'pull_request' && 'read' || 'write' }}"
        permission-vulnerability-alerts: read
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
      with:
        renovate-version: 44.165.0 # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
        token: ${{ steps.app-token.outputs.token }}
    - name: Fail if there are warnings or errors
      run: |
        cat "$RENOVATE_LOG_FILE"
        [ ! -s "$RENOVATE_LOG_FILE" ]
