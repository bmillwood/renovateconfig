on:
  schedule:
  - cron: "30 17 * * 5" # Friday afternoon
  workflow_dispatch:
    inputs:
      dryRun:
        type: boolean
        default: false
  pull_request:
    paths:
    - .github/workflows/renovate.yml
    - composite-actions/renovate/action.yml
    - renovate.sh

jobs:
  upgrade-dependencies:
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        repo:
          - ${{ github.repository }}
          - bmillwood/bluesky-tools
          - bmillwood/freecell
          - bmillwood/nur-packages
          - bmillwood/skerrible
    runs-on: ubuntu-latest
    steps:
    - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
      id: token
      with:
        domain: sts.rpm.cc
        scope: ${{ matrix.repo }}
        identity: ${{ inputs.dryRun && 'renovate-dry-run' || 'renovate' }}
    - uses: $/composite-actions/renovate
      with:
        token: ${{ steps.token.outputs.token }}
        dry-run: ${{ inputs.dryRun || github.event_name == 'pull_request' }}
        repository: ${{ matrix.repo }}
