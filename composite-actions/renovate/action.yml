name: Renovate
description: >-
  Run Renovate on the given repos with bmillwood's usual configuration. Set
  RENOVATE_* environment variables on the step to override or add to it.

inputs:
  token:
    required: true
  dry-run:
    default: ${{ github.event_name == 'pull_request' }}
  repositories:
    default: ${{ github.repository }}

runs:
  using: composite
  steps:
  - run: '$GITHUB_ACTION_PATH/../../renovate.sh'
    shell: bash
    env:
      RENOVATE_REPOSITORIES: ${{ inputs.repositories }}
      RENOVATE_TOKEN: ${{ inputs.token }}
      RENOVATE_DRY_RUN: ${{ inputs.dry-run == 'true' && 'full' || 'null' }}
